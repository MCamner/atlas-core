name: Temporary state-machine integration
on:
  push:
    branches: [feat/state-machine]
    paths: ['.github/workflows/atlas-temp-integrate-state.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/state-machine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge main, correct terminal-state regressions and run tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-commit --no-ff origin/main
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path)
              source=p.read_text(encoding='utf-8')
              assert source.count(old)==1, (path, source.count(old))
              p.write_text(source.replace(old,new), encoding='utf-8')
          patch('atlas_core/controller.py', '        if state.evaluations:\n            candidate = build_memory_candidate(', '        # A failed or provisional run must not promote an earlier evaluation.\n        if state.evaluations and state.stop_reason == "passed":\n            candidate = build_memory_candidate(')
          patch('atlas_core/evaluator.py', '    actionable = bool(gaps) or evidence.actionable\n', '    # Formatting cannot repair a missing/stale source. With evidence gaps,\n    # only an evidence-actionable retry is meaningful.\n    actionable = evidence.actionable if evidence.gaps else bool(gaps)\n')
          patch('atlas_core/finalizer.py', '            "result above is not a verdict on the answer."\n', '            "result above is not a verdict on the answer."\n') if False else None
          final=Path('atlas_core/finalizer.py')
          text=final.read_text(encoding='utf-8')
          old='            f"{failure.get(\'error\', \'an error\')}. Nothing was graded, so the "\n            "result above is not a verdict on the answer."'
          new='            f"{failure.get(\'error\', \'an error\')}. "\n            + ("The failed iteration was not graded; earlier evaluations are "\n               "history, not this run outcome." if latest_eval else "No answer was graded.")'
          assert text.count(old)==1, text.count(old)
          final.write_text(text.replace(old,new),encoding='utf-8')
          PY
          cat > tests/test_terminal_regressions.py <<'PY'
          import tempfile
          import unittest
          from pathlib import Path
          from atlas_core.adapters.model import ModelResult
          from atlas_core.controller import AtlasController
          from atlas_core.finalizer import render_run_text

          class FailSecond:
              def __init__(self): self.n=0
              def execute(self, **kwargs):
                  self.n+=1
                  if self.n==2: raise RuntimeError('provider unavailable')
                  return ModelResult(output='incomplete ' * 50,provider='test',model='fixture')

          class TerminalRegressions(unittest.TestCase):
              def test_missing_sources_not_repaired_by_formatting_retry(self):
                  run=AtlasController(max_iterations=1).run('granska repo och hitta P0 P1 P2',json_mode=True)
                  self.assertEqual(run['stop_reason'],'insufficient_evidence')
                  self.assertEqual(run['iteration'],1)
              def test_failure_does_not_promote_previous_grade_to_memory(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      run=AtlasController(max_iterations=2,model_adapter=FailSecond(),memory_dir=tmp).run('hej',json_mode=True)
                      self.assertEqual(run['stop_reason'],'tool_error')
                      self.assertEqual(len(run['evaluations']),1)
                      self.assertEqual(run['memory_candidates'],[])
                      self.assertEqual(list(Path(tmp).iterdir()),[])
                      text=render_run_text(run)
                      self.assertIn('failed iteration was not graded',text)
                      self.assertNotIn('Nothing was graded',text)
          PY
          pip install -e .
          python -m unittest discover -s tests
          git add atlas_core/controller.py atlas_core/evaluator.py atlas_core/finalizer.py tests/test_terminal_regressions.py
          git commit -m 'merge: integrate state machine and guard terminal outcomes'
          git push origin HEAD:feat/state-machine