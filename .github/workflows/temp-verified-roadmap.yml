name: One-time verified roadmap closure
on:
  push:
    branches: [docs/close-p02-p03-state-verified]
    paths: ['.github/workflows/temp-verified-roadmap.yml']
permissions:
  contents: write
jobs:
  update-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-p02-p03-state-verified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update verified boxes, test, and push for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('ROADMAP.md')
          text=p.read_text(encoding='utf-8')
          p02=text.index('### P0.2 Verifiering ≠ citering')
          p03=text.index('### P0.3 Terminalsäkerhet och resurser')
          a=text[p02:p03]
          a=a.replace('> Två av fyra rutor kryssade efter PR E', '> Fyra av fyra rutor verifierade på `main` efter #20, #22 och #23. #22 mergad som `733588e`; #23 som `a4e1ef2`, med grön test-CI efter varje merge. PR E')
          a=a.replace('> **Ruta tre** är åtgärdad i PR G men inte kryssad förrän den är mergad och resultatet observerat på `main`.', '> **Ruta tre:** #22 är mergad, och slutrapportens fakta/hypotes/rekommendation testas i `tests/test_claim_ledger.py`.')
          a=a.replace('> **Ruta fyra** är åtgärdad i PR H men inte kryssad förrän den är mergad och resultatet observerat på `main`.', '> **Ruta fyra:** #23 är mergad. `tests/test_ci_observations.py` visar att även en grön omkörning är en ny, inaktuell källa för det tidigare citatet.')
          a=a.replace('- [ ] Separera fakta, hypotes och rekommendation.', '- [x] Separera fakta, hypotes och rekommendation.')
          a=a.replace('**Åtgärdad i PR G, kryssas vid merge.**', '**Verifierad i #22 (`733588e`) och på `main`.**')
          a=a.replace('- [ ] Testa falskt fynd som citerar en verkligt läst README', '- [x] Testa falskt fynd som citerar en verkligt läst README')
          a=a.replace('**Åtgärdad i PR H, kryssas vid merge.**', '**Verifierad i #23 (`a4e1ef2`) och på `main`.**')
          assert a.count('- [x]')==4, a.count('- [x]')
          b=text[p03:]
          b=b.replace('- [ ] Versionera explicit state machine och stopporsaker:', '- [x] Versionera explicit state machine och stopporsaker:',1)
          b=b.replace('**Åtgärdad i PR I, kryssas vid merge.**', '**Verifierad i #24 (`821a750`): 355 tester gröna på `main` i testworkflow `35531911033`.**',1)
          b=b.replace('**Återstår i rutan:** `budget_exhausted` och `cancelled` är deklarerade men produceras inte av någon kodväg — de hör till ruta två respektive ruta fyra.', '**Ej producerade ännu:** `budget_exhausted` och `cancelled` är deklarerade men inte nåbara — de hör till fortfarande öppna ruta två respektive ruta fyra.',1)
          b=b.replace('**P0 exit gate:**', '**P0 exit gate (fortfarande öppen tills P0.3 ruta två–fyra och säkerhetsgränserna är verifierade):**',1)
          text=text[:p02]+a+b
          p.write_text(text,encoding='utf-8')
          PY
          pip install -e .
          python -m unittest discover -s tests
          git add ROADMAP.md
          git commit -m 'docs(roadmap): close P0.2 and versioned P0.3 state contract with main evidence'
          git push origin HEAD:docs/close-p02-p03-state-verified