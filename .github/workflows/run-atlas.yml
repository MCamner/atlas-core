name: Run Atlas Core

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Atlas task to run"
        required: true
        default: "granska atlas-core och hitta nästa bästa förbättring"
      json_output:
        description: "Return JSON output"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      repo_target:
        description: "Optional GitHub repo target, for example MCamner/mqobsidian"
        required: false
        default: ""

jobs:
  atlas:
    name: Atlas loop
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout atlas-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Install locked Atlas Core environment
        run: uv sync --locked --group ci

      - name: Run tests
        run: uv run --locked --group ci python -m unittest discover -s tests

      - name: Run Atlas
        # Inputs reach the shell through env, never through ${{ }} interpolation.
        # Expressions are substituted into the script before the shell parses it,
        # so an input containing quotes or a semicolon would otherwise execute as
        # commands on the runner.
        env:
          TASK: ${{ github.event.inputs.task }}
          REPO_TARGET: ${{ github.event.inputs.repo_target }}
          JSON_OUTPUT: ${{ github.event.inputs.json_output }}
        run: |
          mkdir -p atlas-runs

          if [ -n "$REPO_TARGET" ]; then
            if [ "$JSON_OUTPUT" = "true" ]; then
              uv run --locked --group ci atlas run "$TASK" --repo "$REPO_TARGET" --json | tee atlas-runs/atlas-result.json
            else
              uv run --locked --group ci atlas run "$TASK" --repo "$REPO_TARGET" | tee atlas-runs/atlas-result.md
            fi
          else
            if [ "$JSON_OUTPUT" = "true" ]; then
              uv run --locked --group ci atlas run "$TASK" --json | tee atlas-runs/atlas-result.json
            else
              uv run --locked --group ci atlas run "$TASK" | tee atlas-runs/atlas-result.md
            fi
          fi

      - name: Upload Atlas result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-result
          path: atlas-runs/
