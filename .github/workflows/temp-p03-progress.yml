name: One-time P0.3 no-progress integration
on:
  push:
    branches: [feat/p03-no-progress-and-roadmap]
    paths: ['.github/workflows/temp-p03-progress.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-no-progress-and-roadmap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch, test and type-check bounded-only no-progress fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/temp_p03_progress_patch.py
          pip install -e . mypy pyright
          python -m unittest discover -s tests
          mypy atlas_core tests
          pyright atlas_core tests
          git add atlas_core/controller.py
          git commit -m 'feat(p03): stop identical unproductive model retries in bounded runs'
          git push origin HEAD:feat/p03-no-progress-and-roadmap
