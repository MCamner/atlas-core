name: One-time P0.3 type validation
on:
  push:
    branches: [feat/p03-runtime-safety-gates]
    paths: ['.github/workflows/temp-p03-typing.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-runtime-safety-gates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and static type gates
        shell: bash
        run: |
          set -euo pipefail
          pip install -e . mypy pyright
          python -m unittest discover -s tests
          mypy atlas_core tests
          pyright atlas_core tests
