name: Temporary P0.2 integration
on:
  push:
    branches: [feat/ci-observations]
    paths: ['.github/workflows/atlas-temporary-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ci-observations
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate main and test before publishing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-commit --no-ff origin/main
          pip install -e .
          python -m unittest discover -s tests
          git commit -m 'merge: integrate claim ledger and CI observations after tests'
          git push origin HEAD:feat/ci-observations