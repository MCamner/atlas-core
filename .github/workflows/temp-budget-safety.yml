name: One-time budgeted memory boundary
on:
  push:
    branches: [feat/p03-budget-boundaries]
    paths: ['.github/workflows/temp-budget-safety.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-budget-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard memory reads and verify all gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/temp_budget_memory_patch.py
          pip install -e . mypy pyright
          python -m unittest discover -s tests
          mypy atlas_core tests
          pyright atlas_core tests
          git add atlas_core/controller.py tests/test_budget_controller.py
          git commit -m 'fix(budget): refuse unmetered memory reads during bounded runs'
          git push origin HEAD:feat/p03-budget-boundaries