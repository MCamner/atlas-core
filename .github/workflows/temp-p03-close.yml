name: One-time P0.3 roadmap closure
on:
  push:
    branches: [feat/p03-isolated-api]
    paths: ['.github/workflows/temp-p03-close.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-isolated-api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply documentation closure, test, type-check, commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/temp_p03_close_roadmap.py
          pip install -e . mypy pyright
          python -m unittest discover -s tests
          mypy atlas_core tests
          pyright atlas_core tests
          git add ROADMAP.md docs/safety-model.md
          git commit -m 'docs(p03): close scoped runtime safety gates with verified boundaries'
          git push origin HEAD:feat/p03-isolated-api
