name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . mypy pyright
      - run: python -m unittest discover -s tests
      - run: mypy atlas_core tests scripts/pinned_repo_review.py
      - run: pyright atlas_core tests scripts/pinned_repo_review.py
