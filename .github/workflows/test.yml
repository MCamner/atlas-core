name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked --group ci
      - run: uv run --locked --group ci python -m unittest discover -s tests
      - name: Check out pinned mq-agent for gate-parity E2E
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MCamner/mq-agent
          ref: aa7411d9a820239cf9163cf7afad818dfbcdaecf # pragma: allowlist secret
          path: _e2e/mq-agent
          persist-credentials: false
      - name: Run Atlas gate-parity loop against real mq-agent
        run: |
          uv run --locked --group ci atlas run \
            "Kontrollera om release-check.sh och GitHub Actions har samma release-gates. Identifiera konkret drift mellan release-check.sh, tests.yml, markdownlint.yml och mq-stack-gate.yml. Rapportera endast fynd som kan styrkas med de lästa filerna." \
            --repo-path _e2e/mq-agent \
            --max-iterations 4 \
            --wall-seconds 90 \
            --max-tool-calls 48 \
            --max-output-bytes 131072 \
            --json > /tmp/mq-agent-gate-parity.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("/tmp/mq-agent-gate-parity.json").read_text())
          assert run["route"]["name"] == "repo_review", run["route"]
          assert run["plan"]["review"]["topic"] == "ci_gate_parity", run["plan"]["review"]
          assert run["stop_reason"] == "passed", run["stop_reason"]
          last = run["evaluations"][-1]
          assert "findings_are_on_topic" not in last["unmet_criteria"], last
          assert "no_on_topic_finding" not in last["evidence_gaps"], last
          print("E2E_PASS")
          print("route=", run["route"]["name"])
          print("topic=", run["plan"]["review"]["topic"])
          print("stop_reason=", run["stop_reason"])
          print("iteration=", run["iteration"])
          print("evidence_gaps=", last["evidence_gaps"])
          PY
      - name: Remove pinned E2E checkout
        if: always()
        run: rm -rf _e2e
      - run: uv run --locked --group ci mypy atlas_core tests scripts/pinned_repo_review.py scripts/secret_scan_smoke.py
      - run: uv run --locked --group ci pyright atlas_core tests scripts/pinned_repo_review.py scripts/secret_scan_smoke.py scripts/reproducible_build.py
      - run: uv run --locked --group ci pip-audit --strict
      - run: uv run --locked --group ci python scripts/secret_scan_smoke.py
      - name: Scan tracked files for secrets
        run: git ls-files -z -- . ':!.secrets.baseline' | xargs -0 uv run --locked --group ci detect-secrets-hook --baseline .secrets.baseline
      - name: Install hash-locked build inputs
        run: uv sync --locked --only-group build --no-install-project
      - name: Verify reproducible wheel, sdist and release SBOM
        run: uv run --locked --only-group build --no-sync python scripts/reproducible_build.py --output-dir dist/release-integrity
      - name: Generate runtime SBOM
        run: |
          mkdir -p dist
          uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export --output-file dist/atlas-core.cdx.json
          python -c 'import json; from pathlib import Path; bom = json.loads(Path("dist/atlas-core.cdx.json").read_text()); assert bom["bomFormat"] == "CycloneDX"; assert bom["specVersion"] == "1.5"; assert bom["metadata"]["component"]["name"] == "atlas-core"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-core-runtime-sbom
          path: dist/atlas-core.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-core-release-integrity
          path: dist/release-integrity/
          if-no-files-found: error
