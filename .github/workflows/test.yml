name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked --group ci
      - run: uv run --locked --group ci python -m unittest discover -s tests
      - run: uv run --locked --group ci mypy atlas_core tests scripts/pinned_repo_review.py scripts/secret_scan_smoke.py
      - run: uv run --locked --group ci pyright atlas_core tests scripts/pinned_repo_review.py scripts/secret_scan_smoke.py
      - run: uv run --locked --group ci pip-audit --strict
      - run: uv run --locked --group ci python scripts/secret_scan_smoke.py
      - name: Scan tracked files for secrets
        run: git ls-files -z -- . ':!.secrets.baseline' | xargs -0 uv run --locked --group ci detect-secrets-hook --baseline .secrets.baseline
      - name: Generate runtime SBOM
        run: |
          mkdir -p dist
          uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export --output-file dist/atlas-core.cdx.json
          python -c 'import json; from pathlib import Path; bom = json.loads(Path("dist/atlas-core.cdx.json").read_text()); assert bom["bomFormat"] == "CycloneDX"; assert bom["specVersion"] == "1.5"; assert bom["metadata"]["component"]["name"] == "atlas-core"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-core-runtime-sbom
          path: dist/atlas-core.cdx.json
