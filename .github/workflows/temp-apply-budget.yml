name: One-time budget integration
on:
  push:
    branches: [feat/p03-budget-boundaries]
    paths: ['.github/workflows/temp-apply-budget.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-budget-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch and test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/temp_apply_budget.py
          pip install -e .
          python -m unittest discover -s tests
          git add atlas_core/controller.py atlas_core/state.py tests/test_state_machine.py docs/api-contract.md
          git commit -m 'feat(budget): cooperative limits in the controller with honest boundaries'
          git push origin HEAD:feat/p03-budget-boundaries