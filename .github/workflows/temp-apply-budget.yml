name: One-time budget integration
on:
  push:
    branches: [feat/p03-budget-boundaries]
    paths: ['.github/workflows/temp-apply-budget.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-budget-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire budget to the controller and run tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              assert s.count(old)==expected,(path,s.count(old),old)
              p.write_text(s.replace(old,new),encoding='utf-8')
          path='atlas_core/controller.py'
          patch(path,'from .machine import classify_stop\n','from .machine import classify_stop\nfrom .budget import BudgetExceeded, RunBudget, RunLimits\n')
          patch(path,'        json_mode: Literal[False] = ...,\n','        json_mode: Literal[False] = ...,\n        limits: RunLimits | None = ...,\n')
          patch(path,'        json_mode: Literal[True],\n','        json_mode: Literal[True],\n        limits: RunLimits | None = ...,\n')
          patch(path,'        json_mode: bool,\n','        json_mode: bool,\n        limits: RunLimits | None = ...,\n')
          patch(path,'        json_mode: bool = False,\n    ) -> str | dict[str, Any]:\n','        json_mode: bool = False,\n        limits: RunLimits | None = None,\n    ) -> str | dict[str, Any]:\n')
          patch(path,'        state = AtlasRunState(task=task, max_iterations=self.max_iterations)\n','''        state = AtlasRunState(task=task, max_iterations=self.max_iterations)
        budget = RunBudget(limits) if limits is not None else None

        def expired() -> bool:
            if budget is None:
                return False
            try:
                budget.check()
            except BudgetExceeded as exc:
                state.metadata["budget_exhausted"] = str(exc)
                state.stop("budget_exhausted")
                return True
            return False
''')
          patch(path,'        while state.iteration < state.max_iterations:\n','''        if expired():
            return finalize(state, json_mode=json_mode)
        while state.iteration < state.max_iterations:
            if expired():
                break
''')
          patch(path,'            state.enter("executing")\n','            state.enter("executing")\n            if expired():\n                break\n')
          patch(path,'''                    model_result = self.model_adapter.execute(
                        task=task,
                        route=route,
                        plan=plan,
                        observations=state.observations,
                        feedback=feedback,
                    )
                    _check_model_result(model_result)
''','''                    kwargs: dict[str, Any] = dict(
                        task=task, route=route, plan=plan,
                        observations=state.observations, feedback=feedback,
                    )
                    if budget is not None:
                        budget.reserve_model()
                        kwargs["budget"] = budget
                    model_result = self.model_adapter.execute(**kwargs)
                    _check_model_result(model_result)
                    if budget is not None:
                        raw_usage = model_result.metadata.get("usage_tokens")
                        usage = int(raw_usage) if isinstance(raw_usage, str) and raw_usage.isdecimal() else None
                        budget.charge_tokens(usage)
                        budget.charge_output(model_result.output)
                except BudgetExceeded as exc:
                    state.metadata["budget_exhausted"] = str(exc)
                    state.stop("budget_exhausted")
                    break
''')
          patch(path,'            state.outputs.append(output)\n','''            if budget is not None and self.model_adapter is None:
                try:
                    budget.charge_output(output)
                except BudgetExceeded as exc:
                    state.metadata["budget_exhausted"] = str(exc)
                    state.stop("budget_exhausted")
                    break
            state.outputs.append(output)
''')
          patch(path,'            state.enter("evaluating")\n','            state.enter("evaluating")\n            if expired():\n                break\n')
          patch(path,'            state.evaluations.append(evaluation)\n','            state.evaluations.append(evaluation)\n            if expired():\n                break\n')
          patch(path,'        # Only a passing run may promote a memory candidate.\n','''        if budget is not None:
            state.metadata["budget_usage"] = budget.usage()
            # Persisting memory can have side effects after terminal state and
            # currently has no deadline-aware adapter contract. Do not write it.
            state.metadata["memory_skipped"] = "budgeted_run_has_no_metered_memory_writer"
        # Only a passing unbudgeted run may promote a memory candidate.
''')
          patch(path,'        if state.evaluations and state.stop_reason in {"passed"}:\n','        if budget is None and state.evaluations and state.stop_reason in {"passed"}:\n')
          patch('atlas_core/state.py','        spec = spec_for(reason)\n        self.enter(spec.status)\n        self.stop_reason = reason\n','''        spec = spec_for(reason)
        # A resource guard may trip during observation, planning or execution.
        # A budget stop is a controlled terminal interruption, not permission
        # for arbitrary enter("done") transitions in the normal lifecycle.
        if reason == "budget_exhausted":
            from .machine import TERMINAL_STATUSES
            if self.status in TERMINAL_STATUSES:
                check_transition(self.status, spec.status)  # refuse second stop
            self.status = spec.status
        else:
            self.enter(spec.status)
        self.stop_reason = reason
''')
          PY
          cat > tests/test_budget_controller.py <<'PY'
          import unittest
          from atlas_core.budget import RunLimits
          from atlas_core.adapters.model import StubModelAdapter
          from atlas_core.controller import AtlasController

          def limits(**kwargs):
              params=dict(wall_seconds=20,model_calls=3,tool_calls=3,tokens=1000,output_bytes=100000)
              params.update(kwargs)
              return RunLimits(**params)

          class TestBudgetedController(unittest.TestCase):
              def test_budget_stops_before_model_when_call_quota_zero(self):
                  adapter=StubModelAdapter('whatever',metadata={'usage_tokens':'1'})
                  run=AtlasController(model_adapter=adapter).run('hej',json_mode=True,limits=limits(model_calls=0))
                  self.assertEqual(run['stop_reason'],'budget_exhausted')
                  self.assertEqual(adapter.calls,[])
                  self.assertEqual(run['stop_class'],'control')
              def test_unmetered_adapter_fails_closed_instead_of_guessing_tokens(self):
                  run=AtlasController(model_adapter=StubModelAdapter('whatever')).run('hej',json_mode=True,limits=limits())
                  self.assertEqual(run['stop_reason'],'tool_error')
                  self.assertEqual(run['metadata']['failure']['error'],'UnmeteredUsage')
              def test_output_limit_stops_before_grading(self):
                  run=AtlasController().run('hej',json_mode=True,limits=limits(output_bytes=1))
                  self.assertEqual(run['stop_reason'],'budget_exhausted')
                  self.assertEqual(run['evaluations'],[])
              def test_measured_provider_usage_and_budget(self):
                  adapter=StubModelAdapter('incomplete ' * 60,metadata={'usage_tokens':'5'})
                  run=AtlasController(max_iterations=2,model_adapter=adapter).run('hej',json_mode=True,limits=limits(tokens=4))
                  self.assertEqual(run['stop_reason'],'budget_exhausted')
                  self.assertEqual(run['metadata']['budget_usage']['tokens'],5)
                  self.assertEqual(run['memory_candidates'],[])
              def test_normal_call_with_reported_usage(self):
                  adapter=StubModelAdapter('## Recommendation\nx\n## Next step\ny\n## Confidence\nHigh.\n'+'text '*80,metadata={'usage_tokens':'10'})
                  run=AtlasController(model_adapter=adapter).run('hej',json_mode=True,limits=limits())
                  self.assertEqual(run['stop_reason'],'passed')
                  self.assertEqual(run['metadata']['budget_usage']['model_calls'],1)
                  self.assertEqual(run['metadata']['memory_skipped'],'budgeted_run_has_no_metered_memory_writer')
          PY
          pip install -e .
          python -m unittest discover -s tests
          git add atlas_core/controller.py atlas_core/state.py tests/test_budget_controller.py
          git commit -m 'feat(budget): enforce bounded cooperative runs and fail-closed metering'
          git push origin HEAD:feat/p03-budget-boundaries