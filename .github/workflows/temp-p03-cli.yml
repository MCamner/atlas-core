name: One-time P0.3 bounded CLI integration
on:
  push:
    branches: [feat/p03-bounded-cli-observations]
    paths: ['.github/workflows/temp-p03-cli.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p03-bounded-cli-observations
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate bounded reader and CLI, test and type check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/temp_bounded_cli_patch.py
          python tools/temp_bounded_cli_patch2.py
          pip install -e . mypy pyright
          python -m unittest discover -s tests
          mypy atlas_core tests
          pyright atlas_core tests
          git add atlas_core/controller.py atlas_core/cli.py atlas_core/machine.py schemas/atlas-state-machine.v1.json
          git commit -m 'feat(p03): budget repository observations inside controller and bounded CLI'
          git push origin HEAD:feat/p03-bounded-cli-observations
