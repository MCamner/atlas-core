[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core"
version = "1.0.0"
description = "Standalone Atlas 2.0 loop engine: route, plan, execute, evaluate, retry, finalize."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MCamner / Atlas Core" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = []

[dependency-groups]
ci = [
	"detect-secrets==1.5.0",
	"mypy==2.1.0",
	"pip-audit==2.10.1",
	"pyright==1.1.414",
	"pytest==9.0.3",
]
build = [
	"build==1.6.1",
	"setuptools==84.0.0",
	"wheel==0.48.0",
]

[project.scripts]
atlas = "atlas_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_core*"]

[tool.setuptools.package-data]
atlas_core = ["py.typed"]
